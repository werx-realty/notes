<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUBZE Notes">
<meta name="theme-color" content="#16181c">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>HUBZE Notes</title>
<style>
:root{--accent:#2f6fed;--accent2:rgba(47,111,237,.16)}
html[data-theme=darker]{--bg:#08090b;--panel:#111317;--panel2:#1b1e23;--text:#e8eaed;--muted:#8b9099;--line:#262a31}
html[data-theme=dark]{--bg:#16181c;--panel:#1f2227;--panel2:#2a2e35;--text:#eceef1;--muted:#9097a1;--line:#343943}
html[data-theme=grey]{--bg:#3a3d43;--panel:#45484f;--panel2:#53575f;--text:#f1f2f4;--muted:#b7bcc4;--line:#5e626b}
html[data-theme=white]{--bg:#f2f3f6;--panel:#ffffff;--panel2:#eceef2;--text:#16181c;--muted:#6b7280;--line:#e1e4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:pan-x pan-y;position:fixed;inset:0;width:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
.ptxt,.pmark{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.ptxt,.pmark{position:absolute;left:12%;right:3%;top:calc(92/1294*100%);bottom:2%;margin:0;padding:calc(var(--pw)*.004) 0 0;border:0;outline:none;resize:none;overflow:hidden;background:transparent;z-index:3;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:calc(var(--pw)*.024);line-height:calc(var(--pw)*.038);color:var(--ptc,#1a1a1a);caret-color:var(--accent);-webkit-touch-callout:default;touch-action:auto}
#wrap.ty .ptxt{pointer-events:auto}
.pmark{z-index:2;pointer-events:none;color:transparent!important;-webkit-user-select:none;user-select:none}
.pmark mark{background:none;color:transparent;text-decoration:underline wavy;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-skip-ink:none}
.pmark mark.s{text-decoration-color:#ef4444}.pmark mark.g{text-decoration-color:#2f6fed}
.sug{min-width:220px;max-width:320px}.sug .msg{font-size:13px;color:var(--muted);margin:2px 6px 8px;line-height:1.35}
.sug .opt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;font-size:16px}
.sug .opt:hover{background:var(--panel2)}.sug .ign{color:var(--muted);font-weight:500;font-size:14px}

.ib.txt{font-weight:800;font-size:15px;width:auto!important;padding:0 10px;gap:6px;display:flex;align-items:center}
.ib.txt .sw2{width:36px;height:22px}.ib.txt .sw2::after{width:16px;height:16px}.ib.txt .sw2.on::after{left:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{position:fixed;inset:0;display:none}
.view.on{display:flex}
/* Library */
.side{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 12px 14px;overflow:auto;transition:margin .25s;z-index:20}
#lib.noside .side{margin-left:-270px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:6px 8px 18px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1e3a8a,#2f6fed);display:grid;place-items:center;color:#fff}
.logo .i{width:18px;height:18px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;width:100%;text-align:left;margin-bottom:2px}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent2);color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.nav .fm{margin-left:4px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.nav .fm .i{width:18px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:18px 12px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--accent);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:24px;margin:0 6px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--panel2)}
.ib.on{background:var(--accent);color:#fff}
.ib:disabled{opacity:.35}
.search{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);width:220px;font:inherit;outline:none}
.search:focus{border-color:var(--accent)}
.grid{flex:1;overflow:auto;padding:24px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:26px 22px;align-content:start;-webkit-overflow-scrolling:touch}
.card{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.thumb{aspect-ratio:1000/1294;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 1px var(--line);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .st{position:absolute;top:6px;right:6px;color:#f5b301}
.thumb .st .i{fill:#f5b301;stroke:#f5b301;width:18px}
.newc .thumb{background:var(--panel2);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);color:var(--accent)}
.newc .thumb .i{width:40px;height:40px}
.cm{display:flex;align-items:center;gap:4px}
.cm .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.cm .d{font-size:12px;color:var(--muted)}
.cm .more{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
/* Editor */
#ed{flex-direction:column}
#ed.popup{inset:5vh 5vw;border-radius:20px;overflow:hidden;z-index:40;box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 20px 60px rgba(0,0,0,.4);animation:popin .18s ease-out}
@keyframes popin{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
#ed.popup .etop{padding-top:8px}
#ed.popup .pnum,#ed.popup .foot{display:none}
#ed.popup .pages{padding:12px 12px 40px}
#ed.popup .page{box-shadow:none;border-radius:12px}
@media (max-width:760px){#ed.popup{inset:3vh 2vw}}
.etop{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;overflow-x:auto;scrollbar-width:none;flex:none}
.etop::-webkit-scrollbar{display:none}
.ttl{display:flex;flex-direction:column;min-width:130px;max-width:260px;flex:1 1 180px;padding:0 6px}
.ttl input{background:none;border:0;outline:none;color:var(--text);font-weight:700;font-size:18px;font-family:inherit;padding:2px 0;width:100%}
.ttl small{color:var(--muted);font-size:12px}
.pill{display:flex;align-items:center;gap:2px;background:var(--panel2);border-radius:14px;padding:4px;flex:none}
.pill .ib{width:44px;height:40px}
.cdot{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px var(--panel2),0 0 0 3.5px var(--muted)}
.szb{display:flex;flex-direction:column;align-items:center;line-height:1}
.szb b{font-size:10px;margin-top:1px}
.szb .i{height:14px}
.sp{flex:1;min-width:6px}
.zl{font-size:12px;color:var(--muted);min-width:38px;text-align:center}
#wrap{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;position:relative;background:var(--work)}
.pages{padding:22px 16px 30px;width:max-content;min-width:100%}
.page{width:var(--pw);aspect-ratio:1000/1294;margin:0 auto 26px;position:relative;background:var(--paper) 0 0/100% 100% no-repeat;box-shadow:0 2px 12px rgba(0,0,0,.3);touch-action:manipulation}
#wrap.zm{overflow-x:auto}
.page{touch-action:pan-y}
#wrap.zm .page{touch-action:pan-x pan-y}
#wrap.fd .page{touch-action:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page canvas.ink{z-index:1}
.page canvas.live{z-index:2;pointer-events:none}
.imgs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.imgs img{position:absolute;display:block}
.pnum{position:absolute;bottom:-20px;right:2px;font-size:11px;color:var(--muted)}
.foot{text-align:center;padding:0 0 140px}
.addpage{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;background:var(--panel);border:1px dashed var(--line);color:var(--muted);font-weight:600}
.selbox{position:absolute;border:1.5px dashed var(--accent);background:rgba(47,111,237,.07);z-index:4;touch-action:none;cursor:move}
.selbox .h{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:nwse-resize;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);display:flex;gap:2px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;cursor:default;touch-action:manipulation}
.selbox.low .selbar{bottom:auto;top:calc(100% + 22px)}
.selbar button{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}
.selbar button:hover{background:var(--panel2)}
.selbar .fit{color:var(--accent)}
.selbar .del{color:#ef4444}
/* Popovers */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:12px;display:none;max-height:80vh;overflow:auto;width:max-content;max-width:calc(100vw - 16px)}
.pop.on{display:block}
.pop h4{margin:4px 4px 10px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:left;font-weight:600}
.row:hover{background:var(--panel2)}
.row.on{background:var(--accent2);color:var(--accent)}
.row .prev{width:110px;height:28px;margin-left:auto}
.colors{display:grid;grid-template-columns:repeat(7,40px);gap:10px;padding:2px}
.sw{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);position:relative}
.sw.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5.5px var(--accent)}
.sw.add{display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.sizes{display:grid;grid-template-columns:repeat(5,60px);gap:8px}
.szo{height:56px;border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600}
.szo.on{background:var(--accent);color:#fff}
.szo svg{width:30px;height:14px}
input[type=range]{width:100%;accent-color:var(--accent);margin:16px 0 4px}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;width:100%;text-align:left;font-weight:500}
.mi:hover{background:var(--panel2)}
.mi.dan{color:#ef4444}
.hr{height:1px;background:var(--line);margin:8px 0}
.lbl{font-size:12px;color:var(--muted);font-weight:600;margin:10px 4px 8px;text-transform:uppercase;letter-spacing:.05em}
.pswatch{display:flex;gap:8px;flex-wrap:wrap}
.pswatch .sw{width:34px;height:34px}
.tog{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;font-weight:500;width:100%}
.sw2{width:46px;height:28px;border-radius:14px;background:var(--panel2);position:relative;transition:.2s;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw2.on{background:var(--accent)}
.sw2.on::after{left:21px}
/* Modals */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(460px,100%);max-height:86vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h3{margin:0 0 14px;font-size:18px}
.inp{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{padding:10px 18px;border-radius:10px;background:var(--panel2);font-weight:600}
.btn.pri{background:var(--accent);color:#fff}
.btn.dan{background:#ef4444;color:#fff}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.th{position:relative}
.th .pl{display:grid;place-items:center;color:var(--muted)}
.th{border-radius:12px;padding:8px;font-size:12px;font-weight:600;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.th.on{box-shadow:0 0 0 2.5px var(--accent)}
.th i{display:block;height:34px;border-radius:7px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.3)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 4px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:.95}
#print{display:none}
/* Day Ring */
#ring{background:var(--rbg);color:var(--rtx)}
#ring .rside{width:230px;flex:none;background:var(--rpanel);padding:calc(env(safe-area-inset-top) + 14px) 10px 20px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#ring .rside h4{margin:4px 10px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--rmuted)}
#ring .nav{color:var(--rtx)}
#ring .nav:hover{background:var(--rpanel2)}
#ring .nav.on{background:color-mix(in srgb,var(--racc) 22%,transparent);color:var(--rtx)}
#ring .nav .dot{width:10px;height:10px;border-radius:50%;flex:none}
#ring .nav .cnt .i{width:15px;height:15px}
#ring .rmain{flex:1;display:flex;flex-direction:column;min-width:0}
#ring .rtop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
#ring .rtop h2{margin:0 8px;font-size:24px;letter-spacing:-.02em}
#ring .rtop h2 i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--racc);margin-left:3px}
#ring .ib{color:var(--rtx)}
#ring .ib:hover{background:var(--rpanel2)}
#ring .ib.on{background:var(--racc);color:#fff}
#rDays{display:flex;gap:4px;padding:4px 16px 0}
#rDays button{flex:1;padding:9px 0;border-radius:12px;font-weight:700;font-size:13px;color:var(--rmuted);position:relative}
#rDays button.on{background:color-mix(in srgb,var(--racc) 30%,transparent);color:var(--rtx);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--racc) 60%,transparent)}
#rDays button i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--racc)}
.rbody{flex:1;display:flex;min-height:0}
#rStage{flex:1;position:relative;display:grid;place-items:center;min-width:0;padding:10px}
.rsvg{width:min(100%,72vh,620px);height:auto;overflow:visible}
.rsvg .rh{fill:var(--rmuted);font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
.rsvg .rseg{cursor:pointer;stroke:none;transition:opacity .15s}
.rsvg .rseg:hover{opacity:.85}
.rsvg .rlab{fill:#fff;font-size:15px;font-weight:800;letter-spacing:.06em;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.25);stroke-width:2px}
.rcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(42%,300px);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.rnow{background:var(--rtx);color:var(--rbg);font-weight:800;font-size:12px;padding:3px 12px;border-radius:999px;letter-spacing:.08em}
.rct{font-weight:800;font-size:clamp(14px,2.2vw,22px);text-transform:uppercase;letter-spacing:.02em}
.rbig{font-weight:800;font-size:clamp(24px,4vw,40px);letter-spacing:-.02em}
.rsub{color:var(--rmuted);font-size:14px;display:flex;align-items:center;gap:6px}
.rbar{width:70%;height:5px;border-radius:5px;background:var(--rtrack)}
.rbar i{display:block;height:100%;border-radius:5px}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}
#rList{width:340px;flex:none;background:var(--rpanel);border-radius:18px 0 0 0;padding:14px 12px 30px;overflow:auto}
.rlh{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.rlh span{color:var(--rmuted)}
.rnext{margin-left:auto;display:flex;align-items:center;gap:5px}
.rcopy{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--racc) 18%,transparent);color:var(--rtx);font-weight:700;font-size:13px;margin-bottom:10px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--racc) 40%,transparent)}
.rcopy .i{width:16px;height:16px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--rpanel2);margin-bottom:6px;cursor:pointer}
.rrow .ck{width:20px;height:20px;border-radius:50%}
.rrow.done .ck{background:var(--racc);border-color:var(--racc)}
.rrow.done .rtx b{text-decoration:line-through;opacity:.6}
.ric{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none}
.rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.rtx b{font-size:14px}.rtx em{font-style:normal;font-size:10px;background:var(--rtx);color:var(--rbg);padding:1px 6px;border-radius:99px;margin-left:4px}
.rtx small{color:var(--rmuted);font-size:12px}
.rdel{opacity:.45;color:var(--rtx)}.rdel .i{width:17px}
.ricons{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.ricons button{font-size:20px;padding:6px 0;border-radius:9px}
.ricons button.on{background:var(--accent2);box-shadow:inset 0 0 0 2px var(--accent)}
.rdpick{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.rdpick button{padding:10px 14px;border-radius:10px;background:var(--panel2);font-weight:700}
.rdpick button.on{background:var(--accent);color:#fff}
@media (max-width:1100px){#ring .rside{width:190px}#rList{width:290px}}
@media (max-width:700px){.rbody{flex-direction:column;overflow:auto}#rList{width:auto;border-radius:18px 18px 0 0}#ring .rside{display:none}#rStage{flex:none}.rsvg{width:min(92vw,520px)}}

/* Planner */
#plan{background:var(--bg)}
#plan .pside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 12px 30px;display:flex;flex-direction:column;gap:12px}
#plan .pmain{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#plan .ptop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#plan .ptop h2{margin:0 6px;font-size:24px;white-space:nowrap}
#plan .tbtn{padding:9px 14px;border-radius:10px;background:var(--panel2);font-weight:700;font-size:14px}
#pTabs{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
#pTabs button{padding:7px 14px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
#pTabs button.on{background:var(--accent);color:#fff}
#pSearch{width:180px}
.psw{position:relative;margin-left:auto}
#pRes{position:absolute;right:0;top:calc(100% + 6px);width:340px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:8px;z-index:30;display:none}
#pRes.on{display:block}
.sres{border-left:4px solid var(--ec);padding:8px 10px;margin:4px 0;border-radius:6px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column}
.sres small{color:var(--muted);font-size:12px}
#pBody{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column}
.pm{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-height:560px}
.pwd{background:var(--panel);text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
.pc{background:var(--panel);padding:3px 3px 4px;min-height:96px;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.pc.out{background:var(--panel2);opacity:.6}
.pc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.pn{font-size:13px;font-weight:700;padding:2px 4px}
.pc.today .pn span{background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center}
.ev{display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.25;padding:2px 5px;border-radius:5px;border-left:3px solid var(--ec);background:color-mix(in srgb,var(--ec) 16%,transparent);white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;min-height:20px}
.ev.ad{background:var(--ec);color:#fff;border-left-color:transparent;font-weight:600}
.ev .tm{color:var(--muted);font-size:11px;flex:none}
.ev .et{overflow:hidden;text-overflow:ellipsis}
.ev.tk{background:none;border-left:0;padding-left:2px}
.ck{width:14px;height:14px;border-radius:4px;border:2px solid var(--ec,#64748b);flex:none;display:inline-grid;place-items:center;cursor:pointer}
.done .ck,.ev.tk.done .ck{background:var(--accent);border-color:var(--accent)}
.done .ck::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ev.tk.done .et,.trow.done .tx div{text-decoration:line-through;opacity:.55}
.more{font-size:11px;color:var(--muted);padding:0 5px;font-weight:600}
.dropon{box-shadow:inset 0 0 0 3px var(--accent)!important;background:var(--accent2)!important}
.ghost{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-1.5deg)}
/* week / day */
.pw{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);min-height:0}
.pwh,.pwa{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr));border-bottom:1px solid var(--line)}
.pwhd{text-align:center;padding:6px 0;cursor:pointer}
.pwhd small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
.pwhd b{font-size:20px}
.pwhd.today b{background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center}
.pwa .gut small{font-size:10px;color:var(--muted)}
.pwac{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:30px}
.gut{display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.pws{flex:1;overflow:auto;min-height:0}
.pwg{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr));position:relative}
.pwg>.gut{flex-direction:column;align-items:stretch;padding:0}
.hl{height:52px;border-top:1px solid var(--line);position:relative}
.gut .hl{border-top:0}
.gut .hl span{position:absolute;top:-8px;right:6px;font-size:11px;color:var(--muted)}
.tcol{border-left:1px solid var(--line);position:relative;cursor:pointer}
.tcol.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.tev{position:absolute;border-radius:6px;background:color-mix(in srgb,var(--ec) 22%,var(--panel));border-left:4px solid var(--ec);padding:3px 6px;font-size:12px;overflow:hidden;cursor:grab;touch-action:none;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.tev small{color:var(--muted);font-size:11px}
.now{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:2}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444}
/* side */
.pmini .pmh,.pmh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pmini .pmh button{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center}
.pmini .pmh .i{width:18px}
.pmini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px;margin-top:6px}
.pmini .mg b{color:var(--muted);font-size:11px}
.pmini .mg span{padding:5px 0;border-radius:8px;cursor:pointer;position:relative}
.pmini .mg span.o{opacity:.35}
.pmini .mg span.h::after{content:"";position:absolute;bottom:1px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.pmini .mg span.td{color:var(--accent);font-weight:800}
.pmini .mg span.sel{background:var(--accent);color:#fff}
.pbox{background:var(--panel2);border-radius:14px;padding:10px}
.pbh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pbh .cnt{font-size:12px;color:var(--muted)}
.lnk{margin-left:auto;color:var(--accent);font-size:12px;font-weight:700}
.tadd .inp{padding:9px 11px;font-size:14px;margin-bottom:6px}
.trow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px}
.trow .ck{width:18px;height:18px}
.trow .tx{flex:1;min-width:0;font-size:14px}
.trow .tx small{color:var(--muted);font-size:11px}
.trow.late .tx small{color:#ef4444}
.trow .x{opacity:.4}.trow .x .i{width:16px}
.arow{display:flex;gap:8px;padding:7px 8px;border-left:4px solid var(--ec);border-radius:6px;background:var(--panel);margin:4px 0;cursor:pointer;font-size:14px}
.arow .at{color:var(--muted);font-size:12px;min-width:58px}
.arow .ab{display:flex;flex-direction:column}.arow small{color:var(--muted);font-size:11px}
.addday{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--accent);font-weight:700;font-size:14px;padding:6px}
.addday .i{width:18px}
/* edit panel */
#pEdit{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.25);z-index:20;padding:12px 16px 30px;overflow:auto;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;gap:10px}
#pEdit.on{transform:none}
.peh{display:flex;align-items:center;justify-content:space-between}
.inp.big{font-size:20px;font-weight:700}
.inp.sm{padding:8px 10px;font-size:14px;width:auto;flex:1;min-width:0}
.frow{display:flex;align-items:center;gap:8px}
.frow>span{width:58px;font-size:13px;color:var(--muted);font-weight:600}
.inp.notes{min-height:140px;resize:vertical;font-family:inherit}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cgrid b{font-size:12px;color:var(--muted)}
.cgrid button{padding:9px 0;border-radius:10px;font-weight:600}
.cgrid button.o{opacity:.35}
.cgrid button.on{background:var(--text);color:var(--panel)}
.cgrid button.src{box-shadow:inset 0 0 0 2px var(--accent)}
.btn:disabled{opacity:.4}
@media (max-width:1000px){#plan .pside{width:240px}#pSearch{width:120px}}@media (max-width:700px){#plan .pside{display:none}}

/* Calendar */
.navsub{margin:0 0 4px 22px;border-left:2px solid var(--line);padding-left:6px;display:none}
.navsub.on{display:block}
.navsub .nav{padding:8px 10px;font-weight:500;font-size:14px}
.navsub .dot{width:12px;height:12px;border-radius:4px;flex:none}
.nav .chev{margin-left:auto;transition:.2s;color:var(--muted)}.nav .chev.on{transform:rotate(90deg)}
#cal{flex-direction:column;background:var(--cbg);color:var(--ctx);font-family:var(--cbody)}
#cal .ctop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;flex-wrap:wrap}
#cal .ctitle{font-family:var(--chead);font-size:34px;line-height:1.1;color:var(--cacc2);font-weight:700;margin:0 6px;white-space:nowrap;display:flex;align-items:center;gap:8px}
#cal .ctitle svg{width:26px;height:26px;stroke:var(--cacc);fill:none;stroke-width:2}
#cal .cb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ctx);background:var(--ccard)}
#cal .cb:hover{filter:brightness(.96)}
#cal .tbtn{padding:9px 14px;border-radius:12px;background:var(--ccard);font-weight:700;font-size:14px;color:var(--ctx)}
#cal .tabs{display:flex;background:var(--ccard);border-radius:12px;padding:3px;gap:2px;margin-left:auto}
#cal .tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--cmuted)}
#cal .tabs button.on{background:var(--cacc);color:var(--conacc)}
#cal .cbody{flex:1;overflow:auto;padding:4px 16px 30px;-webkit-overflow-scrolling:touch}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--cgap);background:var(--cgridbg);border-radius:16px;padding:var(--cgap);border:var(--cframe)}
.wd{font-size:13px;font-weight:700;text-align:center;color:var(--cmuted);padding:6px 0;text-transform:uppercase;letter-spacing:.05em;font-family:var(--cbodyui)}
.dc{background:var(--ccell);border-radius:var(--crad);min-height:118px;padding:6px 7px;position:relative;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s}
.dc:active{transform:scale(.98)}
.dc.out{opacity:.4}
.dc .n{font-weight:700;font-size:15px;font-family:var(--cbodyui);color:var(--ctx);z-index:1}
.dc.today .n{background:var(--cacc);color:var(--conacc);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.dc .pv{position:absolute;left:4px;right:4px;top:30px;bottom:4px;border-radius:8px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.dc .pv img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;mix-blend-mode:var(--cblend)}
.dc .tt{font-family:var(--chand);font-size:17px;line-height:1.1;color:var(--cacc2);z-index:1;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.wc{background:var(--ccell);border-radius:14px;min-height:240px;padding:26px 12px 10px;position:relative;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.wc::before{content:"";position:absolute;top:-4px;left:50%;width:70px;height:20px;transform:translateX(-50%) rotate(-3deg);background:var(--ctape);opacity:.8;border-radius:2px}
.wc .big{font-family:var(--chead);font-size:40px;font-weight:700;line-height:1;color:var(--ctx)}
.wc .wn{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--cmuted);text-transform:uppercase;font-family:var(--cbodyui)}
.wc .pv{margin-top:8px;border-radius:8px;overflow:hidden;max-height:300px}
.wc .pv img{width:100%;display:block;mix-blend-mode:var(--cblend)}
.wc.today{box-shadow:0 0 0 3px var(--cacc)}
.wc .tt{font-family:var(--chand);font-size:22px;color:var(--cacc2);line-height:1.1;margin-top:4px}
.dayv{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.dayv .bigp{background:var(--ccell);border-radius:16px;min-height:420px;cursor:pointer;overflow:hidden;position:relative;padding:16px}
.dayv .bigp img{width:100%;display:block;mix-blend-mode:var(--cblend)}
.dayv .hint{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--chand);font-size:30px;color:var(--cmuted);text-align:center;padding:20px}
.cside{display:flex;flex-direction:column;gap:12px}
.mini{background:var(--ccell);border-radius:14px;padding:10px;cursor:pointer}
.mini h5{margin:0 0 6px;font-family:var(--chead);font-size:20px;color:var(--cacc2)}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center;font-family:var(--cbodyui)}
.mini .mg span{padding:4px 0;border-radius:6px;position:relative}
.mini .mg span.h::after{content:"";position:absolute;left:50%;bottom:1px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cacc)}
.mini .mg span.td{background:var(--cacc);color:var(--conacc);font-weight:700}
.mini .mg span.sel{box-shadow:inset 0 0 0 2px var(--cacc)}
.mini .mg b{color:var(--cmuted);font-weight:700}
.ygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mnotes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mnote{background:var(--ccell);border-radius:14px;min-height:150px;cursor:pointer;position:relative;overflow:hidden;padding:10px}
.mnote h5{margin:0;font-family:var(--chead);font-size:22px;color:var(--cacc2)}
.mnote img{width:100%;display:block;mix-blend-mode:var(--cblend);margin-top:4px}
.mnote .ph{font-family:var(--chand);font-size:20px;color:var(--cmuted);margin-top:8px}
.doodle{position:absolute;pointer-events:none;opacity:.9}
.chalk .ctitle{text-shadow:0 0 1px rgba(255,255,255,.5)}
@media (max-width:760px){.wgrid{grid-template-columns:repeat(2,1fr)}.ygrid{grid-template-columns:repeat(2,1fr)}.dayv{grid-template-columns:1fr}.dc{min-height:78px}.dc .tt{font-size:14px}#cal .ctitle{font-size:26px}.mnotes{grid-template-columns:1fr}}
@media print{html,body{height:auto;overflow:visible;background:#fff}body>*{display:none!important}#print{display:block!important}#print img{width:100%;display:block;break-after:page;page-break-after:always}@page{margin:0}}
@media (max-width:760px){.side{position:absolute;height:100%;box-shadow:0 0 40px rgba(0,0,0,.4)}.search{width:130px}.grid{padding:16px;gap:18px 14px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style>

<body>

<!-- LIBRARY -->
<div id="lib" class="view on">
  <aside class="side">
    <div class="brand"><span class="logo" id="logoIc"></span>HUBZE Notes</div>
    <div id="navs"></div>
    <div style="flex:1"></div>
    <button class="nav" id="setBtn"></button>
  </aside>
  <div class="main">
    <div class="top">
      <button class="ib" id="hamb"></button>
      <h1 id="vTitle">All Notes</h1>
      <input class="search" id="search" placeholder="Search notes">
      <button class="ib" id="gear2"></button>
      <button class="ib on" id="newBtn" title="New note"></button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- CALENDAR -->
<div id="cal" class="view">
  <div class="ctop">
    <button class="cb" id="calBack" title="Back"></button>
    <button class="cb" id="calPrev" title="Back"></button>
    <button class="cb" id="calNext" title="Next"></button>
    <div class="ctitle" id="calTitle"></div>
    <button class="tbtn" id="calToday">Today</button>
    <button class="tbtn" id="calColors">Colors</button>
    <div class="tabs" id="calTabs"><button data-cv="day">Day</button><button data-cv="week">Week</button><button data-cv="month">Month</button><button data-cv="year">Year</button></div>
  </div>
  <div class="cbody" id="calBody"></div>
</div>

<!-- DAY RING -->
<div id="ring" class="view">
  <aside class="rside"><h4>Rings</h4><div id="rRings"></div></aside>
  <div class="rmain">
    <div class="rtop">
      <button class="ib" id="rBack" title="Back"></button>
      <h2>Day Ring<i></i></h2>
      <div style="flex:1"></div>
      <button class="ib" id="rSet" title="Ring settings"></button>
      <button class="ib on" id="rAdd" title="Add block"></button>
    </div>
    <div id="rDays"></div>
    <div class="rbody"><div id="rStage"></div><div id="rList"></div></div>
  </div>
</div>

<!-- PLANNER -->
<div id="plan" class="view">
  <aside class="pside" id="pSide"></aside>
  <div class="pmain">
    <div class="ptop">
      <button class="ib" id="pBack" title="Back"></button>
      <button class="ib" id="pPrev" title="Back"></button>
      <button class="ib" id="pNext" title="Next"></button>
      <h2 id="pTitle"></h2>
      <button class="tbtn" id="pToday">Today</button>
      <div id="pTabs"><button data-pv="day">Day</button><button data-pv="week">Week</button><button data-pv="month">Month</button></div>
      <button class="tbtn" id="pColors">Colors</button>
      <div class="psw"><input class="search" id="pSearch" placeholder="Search events & tasks"><div id="pRes"></div></div>
      <button class="ib on" id="pAdd" title="New event"></button>
    </div>
    <div style="flex:1;position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden">
    <div id="pBody"></div>
    <div id="pEdit"></div>
    </div>
  </div>
</div>

<!-- EDITOR -->
<div id="ed" class="view">
  <div class="etop">
    <button class="ib" id="closeBtn" title="Close"></button>
    <div class="ttl"><input id="title" placeholder="Untitled Note" maxlength="80"><small id="pgLbl">Page 1</small></div>
    <div class="sp"></div>
    <div class="pill">
      <button class="ib" id="tWrite" title="Pen"></button>
      <button class="ib" id="tColor" title="Color"><span class="cdot" id="cdot"></span></button>
      <button class="ib" id="tSize" title="Size"></button>
      <button class="ib" id="tEraser" title="Eraser"></button>
      <button class="ib" id="tLasso" title="Lasso / select"></button>
      <button class="ib" id="tImage" title="Insert picture"></button>
      <button class="ib txt" id="tText" title="Handwriting to text"><span>Text</span><span class="sw2" id="tTextSw"></span></button>
      <button class="ib txt" id="tType" title="Type on the lines"><span>Type</span><span class="sw2" id="tTypeSw"></span></button>
    </div>
    <div class="sp"></div>
    <button class="ib" id="undoBtn" title="Undo"></button>
    <button class="ib" id="redoBtn" title="Redo"></button>
    <button class="ib" id="zOut" title="Zoom out"></button>
    <span class="zl" id="zLbl">100%</span>
    <button class="ib" id="zIn" title="Zoom in"></button>
    <button class="ib" id="moreBtn" title="More"></button>
  </div>
  <div id="wrap">
    <div class="pages" id="pages"></div>
    <div class="foot"><button class="addpage" id="addPageBtn"></button></div>
  </div>
</div>

<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>
<input type="file" id="imgIn" accept="image/*" hidden>
<input type="file" id="bkIn" accept=".json,application/json" hidden>

<script>
'use strict';
const W=1000,H=1294,GAP=26;
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=v=>Math.round(v*10)/10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Icons ---------- */
const I0={
pen:'<path d="M15 4.5l4.5 4.5L8.5 20H4v-4.5z"/><path d="M13 6.5l4.5 4.5"/>',
pencil:'<path d="M16 3.5l4.5 4.5L9 19.5l-5.5 1 1-5.5z"/><path d="M4.5 15l4.5 4.5M14 5.5l4.5 4.5"/>',

/* ---------- Color helpers ---------- */
function hex2rgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function lum(h){const[r,g,b]=hex2rgb(h);return(.299*r+.587*g+.114*b)/255}

/* ---------- Paper ---------- */
function paperOps(style,color){
 const dark=lum(color)<.45,lc=dark?'rgba(255,255,255,.14)':'rgba(120,140,170,.4)',mc=dark?'rgba(255,110,110,.38)':'rgba(235,110,110,.55)',dc=dark?'rgba(255,255,255,.25)':'rgba(90,100,120,.38)';
 const L=[],D=[];
 if(style==='lined'){for(let y=130;y<H-10;y+=38)L.push([0,y,W,y,lc,1.4]);L.push([110,0,110,H,mc,1.4])}
 else if(style==='grid'){for(let x=40;x<W;x+=40)L.push([x,0,x,H,lc,1.1]);for(let y=40;y<H;y+=40)L.push([0,y,W,y,lc,1.1])}
 else if(style==='dotted'){for(let x=40;x<W;x+=40)for(let y=40;y<H;y+=40)D.push([x,y])}
 return{color,L,D,dc};
}
function paperSVG(o){let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect width="${W}" height="${H}" fill="${o.color}"/>`;
 for(const l of o.L)s+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${l[4]}" stroke-width="${l[5]}"/>`;
 if(o.D.length){s+=`<g fill="${o.dc}">`;for(const d of o.D)s+=`<circle cx="${d[0]}" cy="${d[1]}" r="2.4"/>`;s+='</g>'}
 return s+'</svg>'}
function drawPaper(ctx,o){ctx.fillStyle=o.color;ctx.fillRect(0,0,W,H);
 for(const l of o.L){ctx.strokeStyle=l[4];ctx.lineWidth=l[5];ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.stroke()}
 ctx.fillStyle=o.dc;for(const d of o.D){ctx.beginPath();ctx.arc(d[0],d[1],2.4,0,7);ctx.fill()}}

/* ---------- Ink rendering ---------- */
function baseW(s){return s.t==='marker'?s.w*6:s.t==='sharpie'?s.w*4:s.t==='brush'?s.w*3:s.w*1.5}
function drawStroke(ctx,s,paper){
 const p=s.p,n=p.length/3;if(!n)return;
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 const col=s.t==='pencil'?mix(s.c,paper||'#ffffff',.22):s.c;
 ctx.strokeStyle=ctx.fillStyle=col;
 if(s.t==='marker'||s.t==='sharpie'){
  if(s.t==='marker')ctx.globalAlpha=.38;ctx.lineWidth=baseW(s);ctx.beginPath();ctx.moveTo(p[0],p[1]);
  if(n===1)ctx.lineTo(p[0]+.1,p[1]);
  for(let i=1;i<n-1;i++)ctx.quadraticCurveTo(p[i*3],p[i*3+1],(p[i*3]+p[i*3+3])/2,(p[i*3+1]+p[i*3+4])/2);
  if(n>1)ctx.lineTo(p[n*3-3],p[n*3-2]);
  ctx.stroke();ctx.restore();return;
 }
 const b=baseW(s),f=s.t==='brush'?(q=>.15+q*1.9):s.t==='pencil'?(q=>.35+q*1.1):(q=>.45+q*1.1);
 if(n===1){ctx.beginPath();ctx.arc(p[0],p[1],Math.max(.4,b*f(p[2])/2),0,7);ctx.fill();ctx.restore();return}
 let px=p[0],py=p[1],pw=b*f(p[2]);
 for(let i=1;i<n;i++){
  const x=p[i*3],y=p[i*3+1];let ex,ey;
  if(i<n-1){ex=(x+p[i*3+3])/2;ey=(y+p[i*3+4])/2}else{ex=x;ey=y}
  const w=b*f(p[i*3+2]);ctx.lineWidth=Math.max(.4,(pw+w)/2);
  ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(x,y,ex,ey);ctx.stroke();
  px=ex;py=ey;pw=w;
 }
 ctx.restore();
}

/* ---------- Spelling & grammar (LanguageTool, needs internet) ---------- */
const GC={},gTimers={};
function pageMark(i){return pageEls[i]&&pageEls[i].querySelector('.pmark')}
function clearMarks(i){const m=pageMark(i);if(m)m.innerHTML=''}
function schedCheck(i){if(!N||!N.pages[i])return;clearMarks(i);const id=N.pages[i].id;clearTimeout(gTimers[id]);delete GC[id];gTimers[id]=setTimeout(()=>checkPage(id),1400)}
async function checkPage(id){
 if(!N||!navigator.onLine)return;const i=N.pages.findIndex(p=>p.id===id);if(i<0)return;
 const text=N.pages[i].text||'';if(!text.trim()){clearMarks(i);return}
 try{
  const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text,language:'en-US'})});
  if(!r.ok)return;const j=await r.json();
  const k=N?N.pages.findIndex(p=>p.id===id):-1;if(k<0||(N.pages[k].text||'')!==text)return;
  GC[id]={text,matches:(j.matches||[]).map(m=>({o:m.offset,l:m.length,msg:m.shortMessage||m.message,rep:(m.replacements||[]).slice(0,4).map(x=>x.value),sp:(m.rule&&m.rule.issueType)==='misspelling'}))};
  renderMarks(k);
  const ta=pageTA(k);if(ta)ta.spellcheck=false;
 }catch(_){}
}
function renderMarks(i){
 const m=pageMark(i),c=GC[N.pages[i].id];if(!m)return;if(!c){m.innerHTML='';return}
 let h='',at=0;const t=c.text;
 for(const x of [...c.matches].sort((a,b)=>a.o-b.o)){if(x.o<at)continue;h+=esc(t.slice(at,x.o))+`<mark class="${x.sp?'s':'g'}">${esc(t.slice(x.o,x.o+x.l))}</mark>`;at=x.o+x.l}
 m.innerHTML=h+esc(t.slice(at))+'\n';
}
function sugAt(ta,ev){
 const pe=ta.closest('.page');if(!pe)return;const i=+pe.dataset.i,pg=N.pages[i],c=GC[pg.id];if(!c||c.text!==ta.value)return;
 const pos=ta.selectionStart;const x=c.matches.find(m=>pos>=m.o&&pos<=m.o+m.l);if(!x)return;
 const word=ta.value.slice(x.o,x.o+x.l);
 pop.innerHTML=`<div class="sug"><div class="msg">${esc(x.msg||(x.sp?'Spelling':'Grammar'))}</div>${x.rep.length?x.rep.map((r,k)=>`<button class="opt" data-k="${k}">${esc(r)}</button>`).join(''):`<div class="msg">No suggestions</div>`}<div class="hr"></div><button class="opt ign" data-k="ign">Ignore “${esc(word)}”</button></div>`;
 pop.classList.add('on');popFor=ta;
 pop.style.top=Math.min(ev.clientY+18,innerHeight-pop.offsetHeight-8)+'px';
 pop.style.left=clamp(ev.clientX-pop.offsetWidth/2,8,innerWidth-pop.offsetWidth-8)+'px';
 pop.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;closePops();
  if(b.dataset.k==='ign'){c.matches=c.matches.filter(m=>m!==x);renderMarks(i);return}
  const r=x.rep[+b.dataset.k];ta.value=ta.value.slice(0,x.o)+r+ta.value.slice(x.o+x.l);
  const d=r.length-x.l;c.matches=c.matches.filter(m=>m!==x).map(m=>m.o>x.o?{...m,o:m.o+d}:m);
  pg.text=ta.value;c.text=ta.value;renderMarks(i);onText(ta);ta.focus({preventScroll:true});ta.setSelectionRange(x.o+r.length,x.o+r.length);
  clearTimeout(gTimers[pg.id]);gTimers[pg.id]=setTimeout(()=>{delete GC[pg.id];checkPage(pg.id)},2500)};
}

function txtColor(pc){return lum(pc||'#ffffff')<.45?'#f1f2f4':'#1a1a1a'}
function drawText(ctx,text,pc){
 ctx.save();ctx.fillStyle=txtColor(pc);ctx.font='24px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';ctx.textBaseline='alphabetic';
 const x0=120,maxW=W*.85;let row=0;
 for(const para of text.split('\n')){
  let line='';const words=para.split(' ');
  for(const w of words){const t=line?line+' '+w:w;if(line&&ctx.measureText(t).width>maxW){ctx.fillText(line,x0,130+38*row-9);row++;line=w}else line=t}
  ctx.fillText(line,x0,130+38*row-9);row++;
 }
 ctx.restore();
}
async function dayThumb(meta,pages){
 // transparent, cropped to what was written so it shows nicely inside the calendar box
 const pg=pages[0];if(!pg||isEmpty(pg))return'';
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(a,b,c,d)=>{x0=Math.min(x0,a);y0=Math.min(y0,b);x1=Math.max(x1,c);y1=Math.max(y1,d)};
 for(const s of pg.strokes){const h=baseW(s)/2+2;for(let i=0;i<s.p.length;i+=3)add(s.p[i]-h,s.p[i+1]-h,s.p[i]+h,s.p[i+1]+h)}
 for(const im of pg.images)add(im.x,im.y,im.x+im.w,im.y+im.h);
 if(pg.text&&pg.text.trim()){const rows=pg.text.split('\n').length+Math.floor(pg.text.length/60);add(110,95,W-20,130+38*rows)}
 x0=Math.max(0,x0-14);y0=Math.max(0,y0-14);x1=Math.min(W,x1+14);y1=Math.min(H,y1+14);
 const cw=x1-x0,ch=y1-y0,k=Math.min(1,500/cw,700/ch);
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(cw*k));c.height=Math.max(1,Math.round(ch*k));
 const ctx=c.getContext('2d');ctx.setTransform(k,0,0,k,-x0*k,-y0*k);
 for(const im of pg.images){try{ctx.drawImage(await loadImg(im.src),im.x,im.y,im.w,im.h)}catch(_){}}
 for(const s of pg.strokes)drawStroke(ctx,s,meta.paperColor);
 if(pg.text)drawText(ctx,pg.text,meta.paperColor);
 return c.toDataURL('image/png');
}
async function renderComposite(i,width,meta,pages){
 const c=document.createElement('canvas');c.width=width;c.height=Math.round(width*H/W);
 const ctx=c.getContext('2d'),k=width/W;ctx.setTransform(k,0,0,k,0,0);
 drawPaper(ctx,paperOps(meta.paper||'lined',meta.paperColor||'#ffffff'));
 for(const im of pages[i].images){try{const e=await loadImg(im.src);ctx.drawImage(e,im.x,im.y,im.w,im.h)}catch(_){}}
 for(const s of pages[i].strokes)drawStroke(ctx,s,meta.paperColor);
 if(pages[i].text)drawText(ctx,pages[i].text,meta.paperColor);
 return c;
}

/* ---------- Input: touch / pencil ---------- */
function applyPencilMode(){wrap.classList.toggle('fd',!S.pencilOnly)}
function avgT(ts){let x=0,y=0;for(const t of ts){x+=t.clientX;y+=t.clientY}return{x:x/ts.length,y:y/ts.length}}
function onTouch(e){
 if(e.target.closest('.selbar,.addpage'))return;
 if(typeOn())return;
 if([...e.changedTouches].some(t=>t.touchType==='stylus')){if(e.cancelable)e.preventDefault();return}
 if(!S.pencilOnly){
  if(e.touches.length>=2){
   if(e.type==='touchstart'){cancelAct();tp=avgT(e.touches)}
   else if(tp){const a=avgT(e.touches);wrap.scrollTop-=a.y-tp.y;wrap.scrollLeft-=a.x-tp.x;tp=a}
   if(e.cancelable)e.preventDefault();
  }
  return;
 }
 // palm rejection: don't let a resting hand scroll while the pencil is writing
 if(((act&&act.pen)||Date.now()-lastPen<350)&&e.cancelable)e.preventDefault();
}
wrap.addEventListener('touchstart',onTouch,{passive:false});
wrap.addEventListener('touchmove',onTouch,{passive:false});
wrap.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});

function ptR(e,r){return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function prs(e){return e.pointerType==='pen'?Math.round(clamp(e.pressure||.5,.05,1)*100)/100:.5}
function ensureLive(el){if(liveCv.parentNode!==el)el.appendChild(liveCv);sizeCv(liveCv,el)}
function clearLive(){const c=liveCv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,liveCv.width,liveCv.height)}
function reqLive(){if(!rafL)rafL=requestAnimationFrame(()=>{rafL=0;drawLive()})}
function drawLive(){
 if(!act)return;clearLive();const ctx=liveCv.getContext('2d'),k=liveCv.width/W;ctx.setTransform(k,0,0,k,0,0);
 if(act.mode==='write')drawStroke(ctx,act.s,N.meta.paperColor);
 else if(act.mode==='eraser'&&act.cur){ctx.beginPath();ctx.arc(act.cur[0],act.cur[1],eraserR(),0,7);ctx.fillStyle='rgba(128,128,128,.15)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(100,100,100,.7)';ctx.stroke()}
 else if(act.mode==='lasso'){const P=act.poly;ctx.beginPath();ctx.moveTo(P[0],P[1]);for(let i=2;i<P.length;i+=2)ctx.lineTo(P[i],P[i+1]);ctx.closePath();ctx.fillStyle='rgba(47,111,237,.07)';ctx.fill();ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.strokeStyle='#2f6fed';ctx.stroke()}
}
function cancelAct(){if(!act)return;if(act.mode==='eraser'&&act.remImg&&act.remImg.length){const pg=N.pages[act.pi];for(let j=act.remImg.length-1;j>=0;j--)pg.images.splice(act.remImg[j].i,0,act.remImg[j].im);renderImgs(act.pi)}if(act.mode==='eraser'&&act.removed.length){const pg=N.pages[act.pi];for(let j=act.removed.length-1;j>=0;j--)pg.strokes.splice(act.removed[j].i,0,act.removed[j].s);renderInk(act.pi)}act=null;clearLive()}

wrap.addEventListener('pointerdown',e=>{
 if(!N||e.target.closest('.selbar,.addpage'))return;
 const el=e.target.closest('.page');if(!el)return;
 closePops();
 if(typeOn())return;
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 const sb=e.target.closest('.selbox');
 if(sb){if(!act)startXform(e,el,e.target.classList.contains('h')?'scale':'move');return}
 if(e.pointerType==='touch'&&S.pencilOnly)return;
 if(act)return;
 if(e.pointerType==='mouse'&&e.button!==0)return;
 e.preventDefault();
 const pi=+el.dataset.i,r=el.getBoundingClientRect(),[x,y]=ptR(e,r),pen=e.pointerType==='pen';
 if(pen)lastPen=Date.now();
 try{el.setPointerCapture(e.pointerId)}catch(_){}
 clearSel();
 if(!el._cv)mount(el);
 act={id:e.pointerId,el,pi,pen,rect:r,mode:S.tool};
 ensureLive(el);
 if(S.tool==='write'){clearTimeout(convT);const t=S.tools[S.writing];act.s={t:S.writing,c:t.c,w:t.w,p:[r1(x),r1(y),prs(e)]};drawLive()}
 else if(S.tool==='eraser'){act.removed=[];act.remImg=[];act.last=[x,y];act.cur=[x,y];eraseAt(x,y);drawLive()}

});
wrap.addEventListener('pointermove',e=>{

  const[x,y]=ptR(ev,act.rect);
  if(act.mode==='write'){const p=act.s.p,n=p.length,dx=x-p[n-3],dy=y-p[n-2];if(dx*dx+dy*dy<.6)continue;p.push(r1(x),r1(y),prs(ev))}
  else if(act.mode==='eraser'){eraseSeg(act.last,[x,y]);act.last=[x,y];act.cur=[x,y]}
  else if(act.mode==='lasso'){const P=act.poly,dx=x-P[P.length-2],dy=y-P[P.length-1];if(dx*dx+dy*dy>9)P.push(x,y)}

function endPointer(e){
 if(!act||e.pointerId!==act.id)return;
 const a=act;act=null;
 if(a.mode==='xform'){endXform(a);return}
 if(rafL){cancelAnimationFrame(rafL);rafL=0}

 const pg=N.pages[a.pi];
 if(a.mode==='write'){
  pg.strokes.push(a.s);drawOnInk(a.pi,a.s);const s=a.s;
  pushU({undo(){rm(pg.strokes,s);renderInk(pgOf(pg))},redo(){pg.strokes.push(s);renderInk(pgOf(pg))}});
  afterEdit(a.pi);
  if(textOn()&&s.t!=='marker')queueConv(a.pi,s);
 }else if(a.mode==='eraser'){
  if(a.removed.length||a.remImg.length){const R=a.removed,RI=a.remImg;
   pushU({undo(){for(let j=R.length-1;j>=0;j--)pg.strokes.splice(R[j].i,0,R[j].s);for(let j=RI.length-1;j>=0;j--)pg.images.splice(RI[j].i,0,RI[j].im);const i=pgOf(pg);renderInk(i);renderImgs(i)},redo(){for(const r of R)rm(pg.strokes,r.s);RI.forEach(r=>rm(pg.images,r.im));const i=pgOf(pg);renderInk(i);renderImgs(i)}});
   markDirty()}

wrap.addEventListener('pointerup',endPointer);
wrap.addEventListener('pointercancel',endPointer);

/* ---------- Eraser ---------- */
const eraserR=()=>S.eraser*5+4;
function segD2(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;const cx=ax+t*dx-px,cy=ay+t*dy-py;return cx*cx+cy*cy}
function hitStroke(s,x,y,R){const p=s.p,r=R+baseW(s)/2,r2=r*r;if(p.length===3){const dx=p[0]-x,dy=p[1]-y;return dx*dx+dy*dy<=r2}for(let i=0;i<p.length-3;i+=3)if(segD2(x,y,p[i],p[i+1],p[i+3],p[i+4])<=r2)return true;return false}
function eraseAt(x,y){const pg=N.pages[act.pi],R=eraserR();let hit=false;
 for(let i=pg.images.length-1;i>=0;i--){const im=pg.images[i];if(im.txt&&x>=im.x-R&&x<=im.x+im.w+R&&y>=im.y-R&&y<=im.y+im.h+R){pg.images.splice(i,1);act.remImg.push({im,i});renderImgs(act.pi)}}
for(let i=pg.strokes.length-1;i>=0;i--){const s=pg.strokes[i];if(hitStroke(s,x,y,R)){pg.strokes.splice(i,1);act.removed.push({s,i});hit=true}}if(hit)renderInk(act.pi)}
function eraseSeg(a,b){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),st=Math.max(1,Math.ceil(d/(eraserR()*.6)));for(let k=1;k<=st;k++)eraseAt(a[0]+(b[0]-a[0])*k/st,a[1]+(b[1]-a[1])*k/st)}

/* ---------- Lasso / selection ---------- */
function pip(x,y,P){let c=false;for(let i=0,j=P.length-2;i<P.length;j=i,i+=2){const xi=P[i],yi=P[i+1],xj=P[j],yj=P[j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function doLasso(a){
 const P=a.poly,pg=N.pages[a.pi];
 if(P.length<10){const x=P[0],y=P[1];for(let j=pg.images.length-1;j>=0;j--){const im=pg.images[j];if(x>=im.x&&x<=im.x+im.w&&y>=im.y&&y<=im.y+im.h){setSel(a.pi,[],[im]);return}}return}
 const strokes=pg.strokes.filter(s=>{let inn=0;const n=s.p.length/3;for(let i=0;i<s.p.length;i+=3)if(pip(s.p[i],s.p[i+1],P))inn++;return inn/n>=.5});
 const images=pg.images.filter(im=>pip(im.x+im.w/2,im.y+im.h/2,P));
 if(strokes.length||images.length)setSel(a.pi,strokes,images);
}
function selBB(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const s of sel.strokes){const h=baseW(s)/2;for(let i=0;i<s.p.length;i+=3){x0=Math.min(x0,s.p[i]-h);y0=Math.min(y0,s.p[i+1]-h);x1=Math.max(x1,s.p[i]+h);y1=Math.max(y1,s.p[i+1]+h)}}
 for(const im of sel.images){x0=Math.min(x0,im.x);y0=Math.min(y0,im.y);x1=Math.max(x1,im.x+im.w);y1=Math.max(y1,im.y+im.h)}
 return{x0:x0-6,y0:y0-6,x1:x1+6,y1:y1+6}}
function setSel(pi,strokes,images){
 clearSel();sel={pi,strokes,images};
 const box=document.createElement('div');box.className='selbox';
 const one=images.length===1&&!strokes.length;
 box.innerHTML=`<div class="selbar">${one&&images[0].txt?'<button class="fit" data-a="etxt">Edit text</button>':one?'<button class="fit" data-a="fit">Fit</button>':''}${strokes.length?'<button data-a="color">Color</button>':''}<button data-a="dup">Duplicate</button><button class="del" data-a="del">Delete</button><button data-a="done">Done</button></div><div class="h"></div>`;
 box.querySelector('.selbar').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='fit')selFit();else if(a==='etxt')editTxt();else if(a==='color')selColor();else if(a==='dup')selDup();else if(a==='del')selDelete();else clearSel()});
 pageEls[pi].appendChild(box);sel.box=box;posSel();
}
function posSel(){if(!sel)return;const b=selBB(),s=sel.box.style;s.left=b.x0/W*100+'%';s.top=b.y0/H*100+'%';s.width=(b.x1-b.x0)/W*100+'%';s.height=(b.y1-b.y0)/H*100+'%';sel.box.classList.toggle('low',b.y0<80)}
function clearSel(){if(sel){sel.box.remove();sel=null}}
function snapSel(){return{s:sel.strokes.map(s=>({p:s.p.slice(),w:s.w})),i:sel.images.map(im=>({x:im.x,y:im.y,w:im.w,h:im.h}))}}
function applySnap(pg,strokes,images,sn){strokes.forEach((s,j)=>{s.p=sn.s[j].p.slice();s.w=sn.s[j].w});images.forEach((im,j)=>Object.assign(im,sn.i[j]));const i=pgOf(pg);renderInk(i);images.forEach(im=>posImg(i,im))}
function startXform(e,el,kind){
 e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
 const r=el.getBoundingClientRect(),[x,y]=ptR(e,r);
 act={id:e.pointerId,el,pi:sel.pi,mode:'xform',kind,rect:r,x0:x,y0:y,bb:selBB(),snap:snapSel(),pen:e.pointerType==='pen'};
}
function moveXform(e){
 const[x,y]=ptR(e,act.rect),dx=x-act.x0,dy=y-act.y0,sn=act.snap;
 if(act.kind==='move'){
  sel.strokes.forEach((s,j)=>{const o=sn.s[j].p,p=s.p;for(let i=0;i<o.length;i+=3){p[i]=r1(o[i]+dx);p[i+1]=r1(o[i+1]+dy)}});
  sel.images.forEach((im,j)=>{im.x=sn.i[j].x+dx;im.y=sn.i[j].y+dy});
 }else{
  const bb=act.bb,ox=bb.x0,oy=bb.y0,bw=Math.max(10,bb.x1-ox),bh=Math.max(10,bb.y1-oy);
  const k=clamp(Math.max((bw+dx)/bw,(bh+dy)/bh),.1,10);
  sel.strokes.forEach((s,j)=>{const o=sn.s[j].p,p=s.p;for(let i=0;i<o.length;i+=3){p[i]=r1(ox+(o[i]-ox)*k);p[i+1]=r1(oy+(o[i+1]-oy)*k)}s.w=Math.round(sn.s[j].w*k*100)/100});
  sel.images.forEach((im,j)=>{const o=sn.i[j];im.x=ox+(o.x-ox)*k;im.y=oy+(o.y-oy)*k;im.w=o.w*k;im.h=o.h*k});
 }
 if(!rafX)rafX=requestAnimationFrame(()=>{rafX=0;if(!sel)return;renderInk(sel.pi);sel.images.forEach(im=>posImg(sel.pi,im));posSel()});
}
function endXform(a){
 if(!sel)return;if(!sel.strokes.length&&sel.images.every(m=>m.txt)&&lineGuide()){sel.images.forEach(m=>{const k=m.h/(m.fs*1.32);if(Math.abs(k-1)>.02){const g=lineGuide();m.w=m.w/k;m.h=m.h/k}snapTxt(m)});const i=sel.pi;sel.images.forEach(m=>posImg(i,m));posSel()}
 const before=a.snap,after=snapSel(),pg=N.pages[a.pi],S1=sel.strokes.slice(),I1=sel.images.slice();
 if(JSON.stringify(before)===JSON.stringify(after))return;
 pushU({undo(){applySnap(pg,S1,I1,before)},redo(){applySnap(pg,S1,I1,after)}});markDirty();
}
function selDelete(){
 if(!sel)return;const pg=N.pages[sel.pi],RS=[],RI=[];
 for(const s of sel.strokes){const i=pg.strokes.indexOf(s);pg.strokes.splice(i,1);RS.push({s,i})}
 for(const im of sel.images){const i=pg.images.indexOf(im);pg.images.splice(i,1);RI.push({im,i})}
 const re=()=>{const i=pgOf(pg);renderInk(i);renderImgs(i)};
 pushU({undo(){for(let j=RS.length-1;j>=0;j--)pg.strokes.splice(RS[j].i,0,RS[j].s);for(let j=RI.length-1;j>=0;j--)pg.images.splice(RI[j].i,0,RI[j].im);re()},
        redo(){RS.forEach(r=>rm(pg.strokes,r.s));RI.forEach(r=>rm(pg.images,r.im));re()}});
 clearSel();re();markDirty();
}
function selDup(){
 if(!sel)return;const pi=sel.pi,pg=N.pages[pi];
 const ns=sel.strokes.map(s=>{const c=JSON.parse(JSON.stringify(s));for(let i=0;i<c.p.length;i+=3){c.p[i]+=30;c.p[i+1]+=30}return c});
 const ni=sel.images.map(im=>({...im,id:uid(),x:im.x+30,y:im.y+30}));
 const add=()=>{pg.strokes.push(...ns);pg.images.push(...ni);const i=pgOf(pg);renderInk(i);renderImgs(i)};
 add();pushU({undo(){ns.forEach(s=>rm(pg.strokes,s));ni.forEach(m=>rm(pg.images,m));const i=pgOf(pg);renderInk(i);renderImgs(i)},redo:add});
 setSel(pi,ns,ni);markDirty();
}
function selColor(){
 if(!sel)return;const c=S.tools[S.writing].c,pg=N.pages[sel.pi],L=sel.strokes.map(s=>({s,b:s.c}));
 const set=f=>{L.forEach(o=>o.s.c=f(o));renderInk(pgOf(pg))};
 set(()=>c);pushU({undo(){set(o=>o.b)},redo(){set(()=>c)}});markDirty();
}
function selFit(){
 if(!sel||sel.images.length!==1)return;const im=sel.images[0],pg=N.pages[sel.pi],b={x:im.x,y:im.y,w:im.w,h:im.h};
 const ar=im.ar||im.w/im.h,M=40;let w=W-2*M,h=w/ar;if(h>H-2*M){h=H-2*M;w=h*ar}
 const a={x:(W-w)/2,y:(H-h)/2,w,h};
 const set=v=>{Object.assign(im,v);posImg(pgOf(pg),im);if(sel)posSel()};
 set(a);pushU({undo(){set(b)},redo(){set(a)}});markDirty();
}

/* ---------- Handwriting → typed text ---------- */
let conv=null,convT=0,convWarned=false;
function queueConv(pi,s){if(conv&&conv.pi!==pi)runConv();conv=conv||{pi,strokes:[]};conv.strokes.push(s);clearTimeout(convT);convT=setTimeout(runConv,1100)}
function lineGuide(){const p=N&&N.meta.paper||'lined';if(p==='lined')return{first:130,gap:38,left:118,fs:26};if(p==='grid'||p==='dotted')return{first:40,gap:40,left:40,fs:27};return null}
function snapTxt(im){const g=lineGuide();if(!g||!im.txt)return;const base=im.y+im.h*(1/1.32)*1;let n=Math.round((base-g.first)/g.gap);n=clamp(n,0,Math.floor((H-20-g.first)/g.gap));const line=g.first+n*g.gap;const k=im.h/(im.fs*1.32);im.y=line-im.fs*k-4*k;if(im.x<g.left-2&&N.meta.paper==='lined')im.x=g.left}
function txtImage(txt,fs,c){
 const f=`${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`,cv=document.createElement('canvas'),x=cv.getContext('2d');x.font=f;
 const w=Math.ceil(x.measureText(txt).width)+fs*.3,h=Math.ceil(fs*1.32),k=2;cv.width=w*k;cv.height=h*k;
 x.scale(k,k);x.font=f;x.fillStyle=c;x.textBaseline='alphabetic';x.fillText(txt,fs*.15,fs);
 return{src:cv.toDataURL('image/png'),w,h};
}
async function recognize(strokes){
 let t=0;const ink=strokes.map(s=>{const xs=[],ys=[],ts=[];for(let i=0;i<s.p.length;i+=3){xs.push(Math.round(s.p[i]));ys.push(Math.round(s.p[i+1]));ts.push(t+=16)}return[xs,ys,ts]});
 const r=await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:W,writing_area_height:H},ink,language:'en'}]})});
 const j=await r.json();if(j[0]!=='SUCCESS')throw 0;return(j[1][0][1]||[]).filter(Boolean);
}
async function runConv(){
 clearTimeout(convT);const c=conv;conv=null;if(!c||!N)return;
 const pg=N.pages[c.pi];if(!pg)return;const strokes=c.strokes.filter(s=>pg.strokes.includes(s));if(!strokes.length)return;
 let alts;try{if(!navigator.onLine)throw 0;alts=await recognize(strokes)}catch(_){if(!convWarned){toast('Needs internet to turn writing into text');convWarned=true}return}
 if(!alts.length||!N||N.pages[c.pi]!==pg||!strokes.every(s=>pg.strokes.includes(s)))return;
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of strokes)for(let i=0;i<s.p.length;i+=3){x0=Math.min(x0,s.p[i]);y0=Math.min(y0,s.p[i+1]);x1=Math.max(x1,s.p[i]);y1=Math.max(y1,s.p[i+1])}
 const col=strokes[0].c,g=lineGuide(),fs=g?g.fs:Math.round(clamp((y1-y0)*.8,18,160));
 // fit on the lines: start on the line the writing sits on, wrap long text onto the next lines
 const ims=[];let words=alts[0].split(' '),row=0,sx=g&&N.meta.paper==='lined'?Math.max(x0,g.left):x0;
 const meas=document.createElement('canvas').getContext('2d');meas.font=`${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
 let baseLine=g?g.first+clamp(Math.round(((y0+y1)/2+fs*.35-g.first)/g.gap),0,99)*g.gap:0;
 while(words.length){let line=words.shift();while(words.length&&meas.measureText(line+' '+words[0]).width+fs*.3<W-24-(row?(g?g.left:x0):sx))line+=' '+words.shift();
  const ti=txtImage(line,fs,col),x=row?(g&&N.meta.paper==='lined'?g.left:x0):sx;
  const y=g?baseLine+row*g.gap-fs-4:(y0+y1)/2-ti.h/2+row*ti.h;
  ims.push({id:uid(),src:ti.src,x,y,w:ti.w,h:ti.h,ar:ti.w/ti.h,txt:line,alts:ims.length?[line]:alts.slice(0,6),fs,c:col});row++}
 const im=ims[0];
 const idx=strokes.map(s=>pg.strokes.indexOf(s));
 const apply=()=>{strokes.forEach(s=>rm(pg.strokes,s));pg.images.push(...ims);const i=pgOf(pg);renderInk(i);renderImgs(i)};
 apply();
 pushU({undo(){ims.forEach(m=>rm(pg.images,m));strokes.forEach((s,k)=>pg.strokes.splice(Math.min(idx[k],pg.strokes.length),0,s));const i=pgOf(pg);renderInk(i);renderImgs(i)},redo:apply});
 markDirty();
}
function editTxt(){
 if(!sel||sel.images.length!==1||!sel.images[0].txt)return;const im=sel.images[0],pg=N.pages[sel.pi];
 const setT=async t=>{if(t===null||!t.trim())return;const b={...im},k=im.w/(txtImage(im.txt,im.fs,im.c).w||im.w),ti=txtImage(t,im.fs,im.c);
  const a={src:ti.src,w:ti.w*k,h:ti.h*k,ar:ti.w/ti.h,txt:t};const set=v=>{Object.assign(im,v);const i=pgOf(pg);renderImgs(i);if(sel)posSel()};
  set(a);pushU({undo(){set(b)},redo(){set(a)}});markDirty()};
 sheet('Change text',[...(im.alts||[]).filter(a=>a!==im.txt).map(a=>[a,()=>setT(a)]),['Type it myself…',async()=>setT(await promptBox('Edit text',im.txt))]]);
}

function applyCalColors(){const t=calTh(),el=$('#cal');for(const k in t.v)el.style.setProperty(k,t.v[k])}
let calTheme=null,calView='month',calDate=new Date();
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];

 const mini=(y,mo,selK)=>{const f=new Date(y,mo,1,12),s=sow(f,t.start);let h=`<div class="mg">`;for(let i=0;i<7;i++)h+=`<b>${WDS[(t.start+i)%7][0]}</b>`;for(let i=0;i<42;i++){const x=new Date(s);x.setDate(s.getDate()+i);const k=dkey(x),inm=x.getMonth()===mo;h+=`<span class="${inm&&dm[k]?'h':''} ${k===today&&inm?'td':''} ${k===selK?'sel':''}" style="${inm?'':'opacity:.25'}" data-mday="${k}">${x.getDate()}</span>`}return h+'</div>'};

const PCOL=[['#2f6fed','Blue'],['#ef4444','Red'],['#f97316','Orange'],['#eab308','Yellow'],['#ec4899','Pink'],['#8b5cf6','Purple'],['#4f46e5','Indigo'],['#06b6d4','Cyan'],['#64748b','Gray'],['#92400e','Brown']];
const HH=52; // px per hour in week/day view
async function loadP(){try{const d=await DB.get('data','__planner');if(d&&d.P)P=Object.assign({events:[],tasks:[]},d.P)}catch(_){}}
function saveP(){clearTimeout(pSaveT);pSaveT=setTimeout(()=>{DB.put('data',{id:'__planner',P}).catch(()=>toast('Could not save planner'))},300)}
const kD=k=>new Date(k+'T12:00');
const addD=(k,n)=>{const d=kD(k);d.setDate(d.getDate()+n);return dkey(d)};
const diffD=(a,b)=>Math.round((kD(b)-kD(a))/864e5);
const t2m=t=>{if(!t)return 0;const[h,m]=t.split(':');return(+h)*60+(+m)};
const m2t=m=>{m=clamp(Math.round(m),0,24*60-1);return pad(Math.floor(m/60))+':'+pad(m%60)};
function fmtT(t,short){if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h<12?(short?'a':' AM'):(short?'p':' PM');h=h%12||12;return h+(m||!short?':'+pad(m):'')+ap}
function occurs(e,k){
 const end=e.end||e.start;
 if(!e.rep||e.rep==='none')return k>=e.start&&k<=end;
 if(k<e.start)return false;if(e.until&&k>e.until)return false;
 const span=diffD(e.start,end);
 for(let back=0;back<=span;back++){const s=addD(k,-back);if(s<e.start)break;const n=diffD(e.start,s),a=kD(e.start),b=kD(s);
  if(e.rep==='daily'||(e.rep==='weekly'&&n%7===0)||(e.rep==='weekdays'&&b.getDay()%6!==0)||(e.rep==='monthly'&&a.getDate()===b.getDate())||(e.rep==='yearly'&&a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()))return true}
 return false;
}
function occStart(e,k){const span=diffD(e.start,e.end||e.start);for(let b=0;b<=span;b++){const s=addD(k,-b);if(occurs({...e,end:e.start},s))return s}return k}
function evOn(k){return P.events.filter(e=>occurs(e,k)).sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0)||t2m(a.t1)-t2m(b.t1)||a.title.localeCompare(b.title))}
function tasksOn(k){return P.tasks.filter(t=>t.due===k&&(pShowDone||!t.done||true))}
function newEvent(o){const e=Object.assign({id:uid(),title:'New Event',start:pSel,end:pSel,allDay:false,t1:'09:00',t2:'10:00',color:'#2f6fed',rep:'none',loc:'',notes:''},o);P.events.push(e);saveP();return e}

/* ---------- quick add: "Movie tomorrow 7pm" ---------- */
const WDN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MNN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseQuick(str,base){
 let s=' '+str.trim()+' ',date=null,t1=null,rep='none',dur=60;
 const today=dkey(new Date());
 const take=re=>{const m=s.match(re);if(m){s=s.replace(m[0],' ');return m}return null};
 let m;
 if(m=take(/\s(?:every|each)\s(day|week|month|year|weekday|weekdays|sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\s/i)){
  const w=m[1].toLowerCase();if(w==='day')rep='daily';else if(w.startsWith('weekday'))rep='weekdays';else if(w==='week')rep='weekly';else if(w==='month')rep='monthly';else if(w==='year')rep='yearly';else{rep='weekly';const i=WDN.findIndex(d=>d.startsWith(w.slice(0,3)));let k=today;while(kD(k).getDay()!==i)k=addD(k,1);date=k}}
 if(m=take(/\s(today|tonight)\s/i))date=today;
 else if(m=take(/\s(tomorrow|tmrw|tmr)\s/i))date=addD(today,1);
 else if(m=take(/\s(?:next\s)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat)\s/i)){const i=WDN.findIndex(d=>d.startsWith(m[1].toLowerCase().slice(0,3)));let k=addD(today,1);while(kD(k).getDay()!==i)k=addD(k,1);date=k}
 else if(m=take(/\s(?:on\s)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/i)){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[1]-1,+m[2],12);if(!m[3]&&dkey(d)<today)d.setFullYear(y+1);date=dkey(d)}
 else if(m=take(/\s(?:on\s)?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s(\d{1,2})(?:st|nd|rd|th)?\s/i)){const y=new Date().getFullYear(),d=new Date(y,MNN.indexOf(m[1].toLowerCase().slice(0,3)),+m[2],12);if(dkey(d)<today)d.setFullYear(y+1);date=dkey(d)}
 if(m=take(/\s(?:at\s|@)?(\d{1,2})(?::(\d{2}))?\s?(am|pm|a|p)\s/i)){let h=+m[1]%12;if(/p/i.test(m[3]))h+=12;t1=pad(h)+':'+(m[2]||'00')}
 else if(m=take(/\s(?:at\s|@)(\d{1,2})(?::(\d{2}))?\s/i)){let h=+m[1];if(h>=1&&h<=7)h+=12;t1=pad(h%24)+':'+(m[2]||'00')}
 else if(m=take(/\s(\d{1,2}):(\d{2})\s/i)){t1=pad(+m[1])+':'+m[2]}
 if(m=take(/\sfor\s(\d+(?:\.\d+)?)\s?(h|hr|hrs|hour|hours|m|min|mins|minutes)\s/i))dur=/^h/i.test(m[2])?Math.round(+m[1]*60):+m[1];
 const title=s.replace(/\s+/g,' ').replace(/\s(on|at)$/i,'').trim()||'New Event';
 const d=date||base||today;
 return{title,start:d,end:d,allDay:!t1,t1:t1||'09:00',t2:t1?m2t(t2m(t1)+dur):'10:00',rep};
}
function quickAdd(btn,date){
 openPop(btn,p=>{
  p.innerHTML=`<div style="width:min(420px,86vw)"><input class="inp" id="qaIn" placeholder="Movie tomorrow 7pm" autocomplete="off"><div class="hint" id="qaPrev" style="min-height:20px">Type one line — date and time fill in. Press Enter.</div></div>`;
  const i=$('#qaIn',p),pv=$('#qaPrev',p);
  const show=()=>{if(!i.value.trim()){pv.textContent='Type one line — date and time fill in. Press Enter.';return}const r=parseQuick(i.value,date);pv.innerHTML=`<b>${esc(r.title)}</b> · ${kD(r.start).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${r.allDay?'All-day':fmtT(r.t1)+' – '+fmtT(r.t2)}${r.rep!=='none'?' · repeats '+r.rep:''}`};
  i.oninput=show;i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim()){const r=parseQuick(i.value,date);closePops();const ev=newEvent(r);pSel=r.start;pDate=kD(r.start);renderPlan();openEdit(ev.id)}};

 });
}

/* ---------- rendering ---------- */
function chipHTML(e,k){
 const t=e.allDay?'':`<span class="tm">${fmtT(e.t1,1)}</span>`;
 return`<div class="ev ${e.allDay?'ad':''}" data-ev="${e.id}" data-on="${k}" style="--ec:${e.color}">${t}<span class="et">${esc(e.title)}</span></div>`;
}
function taskChip(t){return`<div class="ev tk ${t.done?'done':''}" data-task="${t.id}" style="--ec:${t.color||'#64748b'}"><span class="ck" data-tick="${t.id}"></span><span class="et">${esc(t.title)}</span></div>`}
function renderPlan(){
 const b=$('#pBody'),today=dkey(new Date());
 document.querySelectorAll('#pTabs button').forEach(x=>x.classList.toggle('on',x.dataset.pv===pView));
 let title='';
 if(pView==='month'){
  const y=pDate.getFullYear(),mo=pDate.getMonth(),f=new Date(y,mo,1,12),s=sow(f,0);title=MON[mo]+' '+y;
  const rows=Math.ceil((f.getDay()+new Date(y,mo+1,0).getDate())/7);
  let h=`<div class="pm" style="grid-template-rows:auto repeat(${rows},minmax(0,1fr))">`;for(let i=0;i<7;i++)h+=`<div class="pwd">${WDS[i]}</div>`;
  for(let i=0;i<rows*7;i++){const x=new Date(s);x.setDate(s.getDate()+i);const k=dkey(x),ev=evOn(k),tk=P.tasks.filter(t=>t.due===k);
   const items=ev.map(e=>chipHTML(e,k)).concat(tk.map(taskChip)),max=4;
   h+=`<div class="pc ${x.getMonth()!==mo?'out':''} ${k===today?'today':''} ${k===pSel?'sel':''}" data-date="${k}"><div class="pn"><span>${x.getDate()}</span></div>${items.slice(0,max).join('')}${items.length>max?`<div class="more" data-date="${k}">+${items.length-max} more</div>`:''}</div>`}
  b.innerHTML=h+'</div>';
 }else{
  const days=pView==='week'?7:1,s=pView==='week'?sow(pDate,0):new Date(pDate);
  const ks=[...Array(days)].map((_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return dkey(x)});
  title=pView==='week'?MON[s.getMonth()]+' '+s.getFullYear():kD(ks[0]).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  let h=`<div class="pw" style="--cols:${days}"><div class="pwh"><div class="gut"></div>${ks.map(k=>{const d=kD(k);return`<div class="pwhd ${k===today?'today':''}" data-date="${k}"><small>${WDS[d.getDay()]}</small><b>${d.getDate()}</b></div>`}).join('')}</div>`;
  h+=`<div class="pwa"><div class="gut"><small>all-day</small></div>${ks.map(k=>`<div class="pwac" data-date="${k}">${evOn(k).filter(e=>e.allDay).map(e=>chipHTML(e,k)).join('')}${P.tasks.filter(t=>t.due===k).map(taskChip).join('')}</div>`).join('')}</div>`;
  h+=`<div class="pws" id="pws"><div class="pwg"><div class="gut">${[...Array(24)].map((_,i)=>`<div class="hl"><span>${i?fmtT(pad(i)+':00',1):''}</span></div>`).join('')}</div>`;
  for(const k of ks){
   const evs=evOn(k).filter(e=>!e.allDay).map(e=>{let a=t2m(e.t1),z=t2m(e.t2);const os=occStart(e,k);if(os!==k)a=0;if((e.end||e.start)>e.start&&addD(os,diffD(e.start,e.end))!==k)z=24*60;if(z<=a)z=a+30;return{e,a,z}});
   const lanes=[];for(const o of evs){let l=0;while(lanes[l]&&lanes[l]>o.a)l++;lanes[l]=o.z;o.l=l}
   h+=`<div class="tcol ${k===today?'today':''}" data-date="${k}" data-tcol="1">${[...Array(24)].map(()=>'<div class="hl"></div>').join('')}`;
   for(const o of evs){const n=Math.max(1,...evs.filter(p=>p.a<o.z&&p.z>o.a).map(p=>p.l+1));h+=`<div class="tev" data-ev="${o.e.id}" data-on="${k}" style="--ec:${o.e.color};top:${o.a/60*HH}px;height:${Math.max(20,(o.z-o.a)/60*HH-2)}px;left:calc(${o.l/n*100}% + 2px);width:calc(${100/n}% - 4px)"><b>${esc(o.e.title)}</b><small>${fmtT(o.e.t1)} – ${fmtT(o.e.t2)}</small></div>`}
   if(k===today){const n=new Date();h+=`<div class="now" style="top:${(n.getHours()*60+n.getMinutes())/60*HH}px"></div>`}
   h+='</div>';
  }
  b.innerHTML=h+'</div></div>';
  const sc=$('#pws');if(sc&&!sc._set){sc.scrollTop=7*HH;sc._set=1}
 }
 $('#pTitle').textContent=title;
 renderPSide();
}

 let h=`<div class="pmini"><div class="pmh"><b>${MON[mo]} ${y}</b><span><button data-mn="-1">${I.left}</button><button data-mn="1">${I.chev}</button></span></div><div class="mg">`;

/* ---------- copy to several days ---------- */
function copyDates(e){
 let mo=kD(e.start);mo=new Date(mo.getFullYear(),mo.getMonth(),1,12);const picked=new Set();
 const m=modal('');const box=$('.modal',m);
 const draw=()=>{const s=sow(mo,0);let h=`<h3>Copy to multiple dates</h3><div class="hint" style="border-left:4px solid ${e.color};padding-left:10px"><b>${esc(e.title)}</b> · ${e.allDay?'All-day':fmtT(e.t1)+' – '+fmtT(e.t2)}</div>
  <div class="pmh" style="margin:12px 0 6px"><button class="ib" data-m="-1">${I.left}</button><b>${MON[mo.getMonth()]} ${mo.getFullYear()}</b><button class="ib" data-m="1">${I.chev}</button></div><div class="cgrid">`;
  for(let i=0;i<7;i++)h+=`<b>${WDS[i][0]}</b>`;
  for(let i=0;i<42;i++){const x=new Date(s);x.setDate(s.getDate()+i);const k=dkey(x);h+=`<button class="${x.getMonth()!==mo.getMonth()?'o':''} ${picked.has(k)?'on':''} ${k===e.start?'src':''}" data-k="${k}">${x.getDate()}</button>`}
  box.innerHTML=h+`</div><div class="hint">${picked.size} selected</div><div class="mrow"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok ${picked.size?'':'disabled'}>Copy</button></div>`};
 draw();
 box.addEventListener('click',ev=>{const d=ev.target.closest('[data-k]');if(d){const k=d.dataset.k;picked.has(k)?picked.delete(k):picked.add(k);draw();return}
  const mm=ev.target.closest('[data-m]');if(mm){mo.setMonth(mo.getMonth()+ +mm.dataset.m);draw();return}
  if(ev.target.closest('[data-x]'))m.remove();
  if(ev.target.closest('[data-ok]')){const span=diffD(e.start,e.end||e.start);for(const k of picked)P.events.push({...e,id:uid(),start:k,end:addD(k,span),rep:'none',until:''});saveP();renderPlan();m.remove();toast(`Copied to ${picked.size} date${picked.size>1?'s':''}`)}});
}
