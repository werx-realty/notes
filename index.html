}
function editBlock(id,preset){
 const ex=R.blocks.find(b=>b.id===id),b=ex?{...ex}:Object.assign({id:uid(),ring:ring().id,wd:rWd,title:'',t1:'09:00',t2:'10:00',color:RCOL[R.blocks.filter(x=>x.ring===ring().id&&x.wd===rWd).length%RCOL.length],icon:'💼'},preset||{});
 const m=modal('');const box=$('.modal',m);
 const draw=()=>{const cu=!RCOL.includes(b.color);box.innerHTML=`<h3>${ex?'Edit block':'New block'}</h3>
  <input class="inp" data-bf="title" value="${esc(b.title)}" placeholder="What are you doing? (Gym, Deep work…)">
  <div class="lbl">Icon</div><div class="ricons">${RICONS.map(i=>`<button class="${b.icon===i?'on':''}" data-bi="${i}">${i}</button>`).join('')}</div>
  <div class="frow" style="margin-top:12px"><span>Start</span><input type="time" class="inp sm" data-bf="t1" value="${b.t1}"><span>End</span><input type="time" class="inp sm" data-bf="t2" value="${b.t2}"></div>
  <div class="hint">${fmtDur(dur(b.t1,b.t2))}${t2m(b.t2)<=t2m(b.t1)?' · goes past midnight':''}</div>
  <div class="lbl">Color</div><div class="pswatch">${RCOL.map(c=>`<button class="sw ${b.color===c?'on':''}" data-bc="${c}" style="background:${c}"></button>`).join('')}<label class="sw add ${cu?'on':''}" style="${cu?'background:'+b.color:''}">${cu?'':I.plus}<input type="color" data-bf="color" value="${b.color}" style="position:absolute;opacity:0;inset:0;width:100%;height:100%"></label></div>
  <div class="mrow" style="justify-content:space-between">${ex?'<button class="btn dan" data-bx="del">Delete</button>':'<span></span>'}<span style="display:flex;gap:10px"><button class="btn" data-bx="cancel">Cancel</button><button class="btn pri" data-bx="save">Save</button></span></div>`;
  const ti=$('[data-bf="title"]',box);if(!ex&&!b.title)setTimeout(()=>ti.focus(),60)};
 draw();
 box.addEventListener('input',e=>{const f=e.target.dataset.bf;if(!f)return;b[f]=e.target.value;if(f==='color')markCustom(e.target,b.color,e.target.closest('.pswatch'));if(f==='t1'||f==='t2'){const h=box.querySelector('.hint');h.textContent=fmtDur(dur(b.t1,b.t2))+(t2m(b.t2)<=t2m(b.t1)?' · goes past midnight':'')}});
 box.addEventListener('click',e=>{const ic=e.target.closest('[data-bi]');if(ic){b.icon=ic.dataset.bi;b.title=$('[data-bf="title"]',box).value;draw();return}
  const c=e.target.closest('[data-bc]');if(c){b.color=c.dataset.bc;b.title=$('[data-bf="title"]',box).value;draw();return}
  const x=e.target.closest('[data-bx]');if(!x)return;
  if(x.dataset.bx==='save'){b.title=b.title.trim()||'Block';if(ex)Object.assign(ex,b);else R.blocks.push(b);saveR();renderRing()}
  if(x.dataset.bx==='del'&&ex){R.blocks=R.blocks.filter(v=>v!==ex);saveR();renderRing()}
  m.remove()});
}
function ringSettings(){
 const r=ring(),m=modal('');const box=$('.modal',m);
 const sw=(arr,key)=>{const cu=!arr.includes(r[key]);return`<div class="pswatch">${arr.map(c=>`<button class="sw ${r[key]===c?'on':''}" data-rk="${key}" data-rv="${c}" style="background:${c}"></button>`).join('')}<label class="sw add ${cu?'on':''}" style="${cu?'background:'+r[key]:''}">${cu?'':I.plus}<input type="color" data-rci="${key}" value="${r[key]}" style="position:absolute;opacity:0;inset:0;width:100%;height:100%"></label></div>`};
 const draw=()=>{box.innerHTML=`<h3>Ring settings</h3><input class="inp" id="rName" value="${esc(r.name)}" placeholder="Ring name">
  <button class="tog" data-rs="sync"><span>Sync with Planner<br><span class="hint" style="margin:0">Show your Planner events for each day on this ring</span></span><span class="sw2 ${r.sync?'on':''}"></span></button>
  <div class="lbl">Ring dot color</div>${sw(RCOL,'color')}
  <div class="lbl">Work area</div><div class="seg" style="margin-bottom:10px"><button class="${r.bgMode!=='gradient'?'on':''}" data-rs="solid">Solid</button><button class="${r.bgMode==='gradient'?'on':''}" data-rs="grad">Gradient</button></div>
  <div class="hint" style="margin:0 4px 6px">${r.bgMode==='gradient'?'Color 1':'Color'}</div>${sw(RBG,'bg')}
  ${r.bgMode==='gradient'?`<div class="hint" style="margin:10px 4px 6px">Color 2</div>${(()=>{if(!r.bg2)r.bg2=mix(r.bg,'#000000',.5).replace(/rgb\((\d+),(\d+),(\d+)\)/,(_,a,b,c)=>'#'+[a,b,c].map(v=>(+v).toString(16).padStart(2,'0')).join(''));return sw(RBG,'bg2')})()}
  <div class="hint" style="margin:10px 4px 6px">Direction</div><div class="seg">${[[180,'↓'],[135,'↘'],[90,'→'],[45,'↗'],['radial','◎']].map(([v,l])=>`<button class="${String(r.gAng??180)===String(v)?'on':''}" data-rang="${v}" style="font-size:18px">${l}</button>`).join('')}</div>`:''}
  <div class="lbl">Ring color</div><div class="pswatch"><button class="sw ${!r.track?'on':''}" data-rs="trackauto" style="background:var(--panel2)" title="Auto"><span style="font-size:10px;font-weight:700">Auto</span></button>${RCOL.concat(['#ffffff','#2b2f33','#000000']).map(c=>`<button class="sw ${r.track===c?'on':''}" data-rk="track" data-rv="${c}" style="background:${c}"></button>`).join('')}<label class="sw add ${r.track&&!RCOL.concat(['#ffffff','#2b2f33','#000000']).includes(r.track)?'on':''}" style="${r.track&&!RCOL.concat(['#ffffff','#2b2f33','#000000']).includes(r.track)?'background:'+r.track:''}">${I.plus}<input type="color" data-rci="track" value="${/^#/.test(r.track||'')?r.track:'#3a3f45'}" style="position:absolute;opacity:0;inset:0;width:100%;height:100%"></label></div>
  <div class="frow" style="margin-top:8px"><span>Opacity</span><input type="range" min="0" max="100" value="${r.trackOp??100}" data-rop="1" style="margin:0;flex:1"><b id="rOpV" style="width:44px;text-align:right">${r.trackOp??100}%</b></div>
  <button class="tog" data-rs="glow"><span>Glow behind the ring</span><span class="sw2 ${r.glow!==false?'on':''}"></span></button>
  <div class="lbl">Accent (glow & buttons)</div>${sw(RCOL,'acc')}
  <div class="mrow" style="justify-content:space-between">${R.rings.length>1?'<button class="btn dan" data-rs="del">Delete ring</button>':'<span></span>'}<button class="btn pri" data-rs="done">Done</button></div>`};
 draw();
 const live=()=>{saveR();renderRing()};
 box.addEventListener('input',e=>{if(e.target.dataset.rop){r.trackOp=+e.target.value;$('#rOpV',box).textContent=r.trackOp+'%';applyRingColors();saveR();return}if(e.target.id==='rName'){r.name=e.target.value||'Ring';live()}const k=e.target.dataset.rci;if(k){r[k]=e.target.value;markCustom(e.target,r[k],e.target.closest('.pswatch'));live()}});
 box.addEventListener('click',async e=>{const s=e.target.closest('[data-rv]');if(s){r[s.dataset.rk]=s.dataset.rv;live();draw();return}
  const ga=e.target.closest('[data-rang]');if(ga){r.gAng=ga.dataset.rang==='radial'?'radial':+ga.dataset.rang;live();draw();return}
  const a=e.target.closest('[data-rs]');if(!a)return;
  if(a.dataset.rs==='sync'){r.sync=!r.sync;live();draw()}
  else if(a.dataset.rs==='solid'){r.bgMode='solid';live();draw()}
  else if(a.dataset.rs==='grad'){r.bgMode='gradient';live();draw()}
  else if(a.dataset.rs==='trackauto'){delete r.track;live();draw()}
  else if(a.dataset.rs==='glow'){r.glow=r.glow===false;live();draw()}
  else if(a.dataset.rs==='done')m.remove();
  else if(a.dataset.rs==='del'){m.remove();if(await confirmBox(`Delete the "${r.name}" ring and its blocks?`,'Delete')){R.blocks=R.blocks.filter(b=>b.ring!==r.id);R.rings=R.rings.filter(x=>x!==r);rCur=R.rings[0].id;saveR();renderRing()}}});
}
function copyDay(){
 const own=R.blocks.filter(b=>b.ring===ring().id&&b.wd===rWd);if(!own.length){toast('No blocks to copy on this day');return}
 const pick=new Set(),m=modal('');const box=$('.modal',m);
 const draw=()=>{box.innerHTML=`<h3>Copy ${WDN[rWd]} to…</h3><div class="hint">Replaces the blocks on the days you pick.</div><div class="rdpick">${WDS.map((d,i)=>i===rWd?'':`<button class="${pick.has(i)?'on':''}" data-pd="${i}">${d}</button>`).join('')}</div><button class="mi" data-pa="wk">Weekdays</button><button class="mi" data-pa="all">Every day</button><div class="mrow"><button class="btn" data-pa="x">Cancel</button><button class="btn pri" data-pa="ok" ${pick.size?'':'disabled'}>Copy</button></div>`};
 draw();
 box.addEventListener('click',e=>{const d=e.target.closest('[data-pd]');if(d){const i=+d.dataset.pd;pick.has(i)?pick.delete(i):pick.add(i);draw();return}
  const a=e.target.closest('[data-pa]');if(!a)return;const k=a.dataset.pa;
  if(k==='wk'){[1,2,3,4,5].forEach(i=>i!==rWd&&pick.add(i));draw()}else if(k==='all'){[0,1,2,3,4,5,6].forEach(i=>i!==rWd&&pick.add(i));draw()}
  else if(k==='x')m.remove();
  else if(k==='ok'){R.blocks=R.blocks.filter(b=>!(b.ring===ring().id&&pick.has(b.wd)));for(const i of pick)for(const b of own)R.blocks.push({...b,id:uid(),wd:i,doneOn:{}});saveR();renderRing();m.remove();toast(`Copied to ${pick.size} day${pick.size>1?'s':''}`)}});
}
$('#ring').addEventListener('click',async e=>{
 const rs=e.target.closest('[data-rsel]');if(rs){rCur=rs.dataset.rsel;renderRing();return}
 if(e.target.closest('#rAddRing')){const n=await promptBox('New ring name','');if(n){const c=RCOL[R.rings.length%RCOL.length],r={id:uid(),name:n,color:c,bg:ring().bg,acc:c,sync:false};R.rings.push(r);rCur=r.id;saveR();renderRing()}return}
 const wd=e.target.closest('[data-rwd]');if(wd){rWd=+wd.dataset.rwd;renderRing();return}
 if(e.target.closest('#rCopy')){copyDay();return}
 const dn=e.target.closest('[data-rdone]');if(dn){const b=R.blocks.find(x=>x.id===dn.dataset.rdone);if(b){const k=wkDate(rWd);b.doneOn=b.doneOn||{};b.doneOn[k]=!b.doneOn[k];saveR();renderRing()}return}
 const dl=e.target.closest('[data-rdel]');if(dl){if(await confirmBox('Delete this block?','Delete')){R.blocks=R.blocks.filter(x=>x.id!==dl.dataset.rdel);saveR();renderRing()}return}
 const bk=e.target.closest('[data-rb]');if(bk){if(bk.dataset.rev){const ev=P.events.find(x=>x.id===bk.dataset.rb);if(ev){pSel=wkDate(rWd);pDate=kD(pSel);openPlan();openEdit(ev.id)}}else editBlock(bk.dataset.rb);return}
});
$('#rAdd').onclick=()=>{const bl=ringBlocks(ring(),rWd);const last=bl.length?bl[bl.length-1].t2:'09:00';editBlock(null,{t1:last,t2:m2t(t2m(last)+60)})};
$('#rSet').onclick=ringSettings;
$('#rBack').onclick=()=>{clearInterval(rTick);show('lib');renderLibrary()};

/* ---------- Static icons ---------- */
$('#logoIc').innerHTML=I.pen;$('#rBack').innerHTML=I.x;$('#rSet').innerHTML=I.gear;$('#rAdd').innerHTML=I.plus;$('#pBack').innerHTML=I.x;$('#pPrev').innerHTML=I.left;$('#pNext').innerHTML=I.chev;$('#pAdd').innerHTML=I.plus;$('#calBack').innerHTML=I.x;$('#calPrev').innerHTML=I.left;$('#calNext').innerHTML=I.chev;$('#hamb').innerHTML=I.menu;$('#newBtn').innerHTML=I.plus;$('#gear2').innerHTML=I.gear;
$('#setBtn').innerHTML=I.gear+'<span>Settings</span>';$('#closeBtn').innerHTML=I.x;$('#tEraser').innerHTML=I.eraser;
$('#tLasso').innerHTML=I.lasso;$('#tImage').innerHTML=I.image;$('#undoBtn').innerHTML=I.undo;$('#redoBtn').innerHTML=I.redo;
$('#zIn').innerHTML=I.zin;$('#zOut').innerHTML=I.zout;$('#moreBtn').innerHTML=I.dots;$('#addPageBtn').innerHTML=I.plus+'Add Page';

['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
/* ---------- Boot ---------- */
(async()=>{
 applyTheme();applyPencilMode();
 if(innerWidth<760)S.sidebar=false;
 $('#lib').classList.toggle('noside',!S.sidebar);
 try{await DB.open();metas=await DB.all('meta');await loadP();await loadR()}catch(e){toast('Storage unavailable in this browser mode')}
 renderLibrary();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
